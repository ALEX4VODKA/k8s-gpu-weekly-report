[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-gpu-weekly-report"
version = "0.1.0"
description = "Snapshot and aggregate Kubernetes GPU allocation from resource requests."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
